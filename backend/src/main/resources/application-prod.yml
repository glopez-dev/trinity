spring:
  # Application Name
  application:
    name: ${SPRING_APP_NAME}

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL} 
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Schema is owned by Flyway migrations (db/migration), Hibernate only validates.
  flyway:
    enabled: true

  # Web Configuration
  web:
    resources:
      add-mappings: false

# Server Configuration
server:
  error:
    whitelabel:
      enabled: false

# Management (Actuator) Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    org:
      springframework: DEBUG
      hibernate: ERROR

# JWT Configuration (New)
jwt:
  secret: ${SPRING_JWT_SECRET}
  expiration: ${SPRING_JWT_EXPIRATION}

app:
  cors:
    allowed-origins: ${SPRING_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    use-root-path: false
    url: /api/v1/api-docs
    config-url: /api/v1/api-docs/swagger-config
  pathsToMatch: /api/v1/**

# PayPal Configuration
paypal:
  client:
    id: ${SPRING_PAYPAL_CLIENT_ID}
    secret: ${SPRING_PAYPAL_SECRET}
  mode: live

# Stripe Configuration
stripe:
  api:
    key: ${SPRING_STRIPE_SECRET_KEY}

# Payment Checkout Configuration
payment:
  checkout:
    success-url: ${PAYMENT_SUCCESS_URL}
    cancel-url: ${PAYMENT_CANCEL_URL}
    default-currency: USD