#####################################
# Spring Boot Configuration
#####################################
spring:
  application:
    name: ${SPRING_APP_NAME:trinity-test}
    version: ${SPRING_APP_VERSION:0.0.1-TEST}

  config:
    activate:
      on-profile: test

#####################################
### Datasource Configuration
#####################################
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driverClassName: org.h2.Driver
    username: sa
    password: ""

#####################################
### JPA/Hibernate Configuration
#####################################
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          format_sql: true
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  main:
    banner-mode: off

#####################################
### DevTools Configuration
#####################################
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      exclude: static/**,public/**
    livereload:
      enabled: true

#####################################
### Web Configuration
#####################################
  web:
    resources:
      add-mappings: false

#####################################
# Server Configuration
#####################################
server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always


#####################################
# Logging Configuration
#####################################
logging:
  level:
    root: WARN
    org:
      springframework: ERROR
      hibernate: ERROR 
      hibernate.SQL: ERROR 
      hibernate.type.descriptor.sql: ERROR 

#####################################
# Swagger Configuration
#####################################
jwt:
  secret: ${SPRING_JWT_SECRET:b24bfe05b10f876172094ffa542dd10b43437cd9934d95c844a5006e51a8038a}
  expiration: ${SPRING_JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

#####################################
# Payment Configuration (dummy values for tests)
#####################################
stripe:
  api:
    key: ${SPRING_STRIPE_SECRET_KEY:sk_test_dummy}

paypal:
  client:
    id: ${SPRING_PAYPAL_CLIENT_ID:dummy-client-id}
    secret: ${SPRING_PAYPAL_CLIENT_SECRET:dummy-secret}
  mode: sandbox

payment:
  checkout:
    success-url: http://localhost:8080/success
    cancel-url: http://localhost:8080/cancel
    default-currency: USD

#####################################
# Swagger Configuration
#####################################
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
  show-actuator: true
  packages-to-scan: com.trinity.controller