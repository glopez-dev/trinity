---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: trinity-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: silica5518/t-dev-701-frontend:prod-3ed2d044
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: trinity-config